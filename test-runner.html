<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ScaleWithLakshya CRM - Core Unit & Integration Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <script src="sheets.js"></script>
</head>

<body class="bg-neutral-900 text-neutral-100 p-8 font-mono text-xs">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="border-b border-neutral-700 pb-4">
      <h1 class="text-xl font-bold text-violet-400">ScaleWithLakshya CRM - Core Verification Suite</h1>
      <p class="text-neutral-400 mt-1">Testing domain/phone normalizers, duplicate detection, schema specs, and URL
        parsing.</p>
    </div>

    <div id="test-results" class="space-y-2 bg-neutral-950 p-6 rounded-lg border border-neutral-800">
      <!-- Injected test results -->
    </div>

    <div id="test-summary" class="p-4 rounded-lg font-bold text-sm">
      <!-- Injected summary -->
    </div>
  </div>

  <script>
    const resultsContainer = document.getElementById('test-results');
    const summaryContainer = document.getElementById('test-summary');
    let passed = 0;
    let failed = 0;

    function assert(condition, testName, details = '') {
      const el = document.createElement('div');
      el.className = 'flex items-center justify-between py-1 border-b border-neutral-900';
      if (condition) {
        passed++;
        el.innerHTML = `<span class="text-emerald-400 font-semibold">✓ PASS: ${testName}</span> <span class="text-neutral-500">${details}</span>`;
      } else {
        failed++;
        el.innerHTML = `<span class="text-rose-500 font-bold">✗ FAIL: ${testName}</span> <span class="text-rose-300">${details}</span>`;
      }
      resultsContainer.appendChild(el);
    }

    // 1. Domain Normalization
    assert(sheetsService.normalizeDomain('https://example.com') === 'example.com', 'Domain: https://example.com', 'example.com');
    assert(sheetsService.normalizeDomain('http://example.com') === 'example.com', 'Domain: http://example.com', 'example.com');
    assert(sheetsService.normalizeDomain('https://www.example.com/') === 'example.com', 'Domain: https://www.example.com/', 'example.com');
    assert(sheetsService.normalizeDomain('www.example.com') === 'example.com', 'Domain: www.example.com', 'example.com');
    assert(sheetsService.normalizeDomain('https://sub.domain.com/path?foo=bar#baz') === 'sub.domain.com', 'Domain: subdomain with path/query', 'sub.domain.com');
    assert(sheetsService.normalizeDomain('') === '', 'Domain: empty input', 'returns empty');

    // 2. Phone Normalization
    assert(sheetsService.normalizePhone('(555) 123-4567') === '5551234567', 'Phone: (555) 123-4567', '5551234567');
    assert(sheetsService.normalizePhone('+1 (555) 123-4567') === '+15551234567', 'Phone: +1 (555) 123-4567', '+15551234567');
    assert(sheetsService.normalizePhone('555.123.4567') === '5551234567', 'Phone: 555.123.4567', '5551234567');
    assert(sheetsService.normalizePhone('') === '', 'Phone: empty input', 'returns empty');

    // 3. Spreadsheet URL Extraction
    const sampleUrl = 'https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/edit#gid=0';
    assert(sheetsService.extractSpreadsheetId(sampleUrl) === '1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms', 'Spreadsheet URL extraction (edit URL)');
    assert(sheetsService.extractSpreadsheetId('https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms') === '1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms', 'Spreadsheet URL extraction (clean)');
    assert(sheetsService.extractSpreadsheetId('1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms') === '1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms', 'Spreadsheet ID (raw string)');
    assert(sheetsService.extractSpreadsheetId('invalid-short-id') === null, 'Spreadsheet ID invalid check');

    // 4. Schema Specifications
    assert(CONFIG.LEADS_COLUMNS.length === 24, 'LEADS schema has exactly 24 columns', `${CONFIG.LEADS_COLUMNS.length}/24`);
    assert(CONFIG.ACTIVITY_COLUMNS.length === 8, 'ACTIVITY schema has exactly 8 columns', `${CONFIG.ACTIVITY_COLUMNS.length}/8`);
    assert(CONFIG.SETTINGS_COLUMNS.length === 6, 'SETTINGS schema has exactly 6 columns', `${CONFIG.SETTINGS_COLUMNS.length}/6`);
    assert(CONFIG.LEADS_COLUMNS[0] === 'lead_id' && CONFIG.LEADS_COLUMNS[23] === 'archived_at', 'LEADS column boundary check', 'lead_id ... archived_at');
    assert(CONFIG.ACTIVITY_COLUMNS[0] === 'activity_id' && CONFIG.ACTIVITY_COLUMNS[7] === 'notes', 'ACTIVITY column boundary check', 'activity_id ... notes');
    assert(CONFIG.SETTINGS_COLUMNS[0] === 'setting_group' && CONFIG.SETTINGS_COLUMNS[5] === 'description', 'SETTINGS column boundary check', 'setting_group ... description');

    // 5. Deterministic Duplicate Detection
    const existingLeads = [
      {
        lead_id: 'lead_1',
        business_name: 'Apex Solar',
        location: 'Austin, TX',
        website: 'https://www.apexsolar.com/',
        phone: '+1 512-555-0100',
        google_place_id: 'ChIJ_apex_123',
        normalized_domain: 'apexsolar.com',
        normalized_phone: '+15125550100',
        archived_at: ''
      },
      {
        lead_id: 'lead_2',
        business_name: 'Old Archived Lead',
        location: 'Denver, CO',
        website: 'https://oldlead.com',
        phone: '+1 303-555-0199',
        google_place_id: 'ChIJ_old_999',
        normalized_domain: 'oldlead.com',
        normalized_phone: '+13035550199',
        archived_at: '2026-01-01T00:00:00Z'
      }
    ];

    const dup1 = sheetsService.findDuplicate({ google_place_id: 'ChIJ_apex_123' }, existingLeads);
    assert(dup1.duplicate === true, 'Duplicate check: Google Place ID matches', dup1.reason);

    const dup2 = sheetsService.findDuplicate({ website: 'http://apexsolar.com/services' }, existingLeads);
    assert(dup2.duplicate === true, 'Duplicate check: Normalized Domain matches', dup2.reason);

    const dup3 = sheetsService.findDuplicate({ phone: '(512) 555-0100' }, existingLeads);
    assert(dup3.duplicate === true, 'Duplicate check: Normalized Phone matches', dup3.reason);

    const dup4 = sheetsService.findDuplicate({ business_name: 'Apex Solar', location: 'Austin, TX' }, existingLeads);
    assert(dup4.duplicate === true, 'Duplicate check: Business Name + Location matches', dup4.reason);

    const noDup = sheetsService.findDuplicate({
      business_name: 'Bright Sun Solar',
      location: 'Austin, TX',
      website: 'https://brightsunsolar.com',
      phone: '512-555-9999'
    }, existingLeads);
    assert(noDup.duplicate === false, 'Duplicate check: Allows unique lead');

    const archivedMatch = sheetsService.findDuplicate({ website: 'https://oldlead.com' }, existingLeads);
    assert(archivedMatch.duplicate === false, 'Duplicate check: Archived leads do not block new leads');

    // 6. Contact Activity Types Check
    assert(CONFIG.CONTACT_ACTIVITY_TYPES.includes('Initial DM'), 'Activity: Initial DM triggers last_contacted_at update');
    assert(CONFIG.CONTACT_ACTIVITY_TYPES.includes('Email Sent'), 'Activity: Email Sent triggers last_contacted_at update');
    assert(!CONFIG.CONTACT_ACTIVITY_TYPES.includes('Note Added'), 'Activity: Note Added does NOT update last_contacted_at');
    assert(!CONFIG.CONTACT_ACTIVITY_TYPES.includes('Status Changed'), 'Activity: Status Changed does NOT update last_contacted_at');
    assert(!CONFIG.CONTACT_ACTIVITY_TYPES.includes('Won'), 'Activity: Won does NOT update last_contacted_at');
    assert(!CONFIG.CONTACT_ACTIVITY_TYPES.includes('Lost'), 'Activity: Lost does NOT update last_contacted_at');

    // 7. E2E CRM In-Memory Operations Test
    (async () => {
      // Create mock storage
      const mockStorage = {
        leads: [
          {
            lead_id: 'lead_test_1',
            business_name: 'Alpha Dental',
            contact_name: 'Dr. Sarah Smith',
            niche: 'Dental Clinic',
            location: 'Miami, FL',
            website: 'https://alphadental.com',
            phone: '305-555-0144',
            status: 'New',
            lead_tier: 'A',
            lead_source: 'Manual',
            lead_score: '80',
            opportunity_score: '90',
            date_added: '2026-09-18T10:00:00Z',
            last_contacted_at: '',
            next_follow_up_at: '2026-09-19T14:00:00Z',
            notes: 'High potential client',
            normalized_domain: 'alphadental.com',
            normalized_phone: '3055550144',
            record_version: 1,
            updated_at: '2026-09-18T10:00:00Z',
            archived_at: '',
            _rowIndex: 2
          }
        ],
        activities: []
      };

      // Mock sheetsService methods for offline/in-memory testing
      const testService = new SheetsService();
      testService.getAllLeads = async () => JSON.parse(JSON.stringify(mockStorage.leads));
      testService.getAllActivities = async () => JSON.parse(JSON.stringify(mockStorage.activities));
      testService.appendRows = async (sheetId, range, rows) => {
        if (range.includes('LEADS')) {
          rows.forEach(r => {
            const lead = {};
            CONFIG.LEADS_COLUMNS.forEach((col, idx) => lead[col] = r[idx]);
            lead._rowIndex = mockStorage.leads.length + 2;
            mockStorage.leads.push(lead);
          });
        } else if (range.includes('ACTIVITY')) {
          rows.forEach(r => {
            const act = {};
            CONFIG.ACTIVITY_COLUMNS.forEach((col, idx) => act[col] = r[idx]);
            mockStorage.activities.push(act);
          });
        }
      };
      testService.updateRange = async (sheetId, range, rows) => {
        const rowMatch = range.match(/!A(\d+):/);
        if (rowMatch) {
          const rowIdx = parseInt(rowMatch[1], 10);
          const lead = mockStorage.leads.find(l => l._rowIndex === rowIdx);
          if (lead) {
            CONFIG.LEADS_COLUMNS.forEach((col, idx) => lead[col] = rows[0][idx]);
          }
        }
      };

      // Test Create Lead
      const created = await testService.createLead('test_sheet', {
        business_name: 'Zenith Solar',
        contact_name: 'Marcus Vance',
        niche: 'Solar',
        location: 'Phoenix, AZ',
        website: 'https://zenithsolar.com',
        phone: '602-555-0199',
        status: 'Ready to Contact',
        lead_tier: 'B',
        lead_source: 'Referral'
      }, mockStorage.leads);

      assert(created && created.lead_id.startsWith('lead_'), 'E2E: Create lead returns valid lead_id');
      assert(mockStorage.leads.length === 2, 'E2E: Database lead count is now 2');

      // Test Optimistic Concurrency Protection
      try {
        await testService.updateLead('test_sheet', 'lead_test_1', { status: 'Contacted' }, 999);
        assert(false, 'E2E: Should have rejected stale expectedVersion 999');
      } catch (err) {
        assert(err.isConcurrencyError === true, 'E2E: Optimistic concurrency blocks stale update');
      }

      // Test Valid Update
      const updated = await testService.updateLead('test_sheet', 'lead_test_1', { status: 'Contacted' }, 1);
      assert(updated.record_version === 2, 'E2E: Update increments record_version to 2');
      assert(updated.status === 'Contacted', 'E2E: Status updated to Contacted');

      // Test Add Activity with auto last_contacted_at update
      const { activity, updatedLead } = await testService.addActivity('test_sheet', {
        lead_id: 'lead_test_1',
        activity_type: 'Initial DM',
        channel: 'Instagram',
        summary: 'Sent intro message'
      }, updated);

      assert(activity.activity_id.startsWith('act_'), 'E2E: Activity created with valid ID');
      assert(updatedLead && updatedLead.last_contacted_at, 'E2E: Contact activity updates last_contacted_at');

      // Test Archive Lead
      const archived = await testService.archiveLead('test_sheet', 'lead_test_1', updatedLead.record_version);
      assert(archived.archived_at !== '', 'E2E: Archiving sets archived_at timestamp');

      // Test 8. Allowlist Normalized Matching
      const allowedSample = ['ALLOWED_USER_1', '  User2@Example.com  '];
      const isAllowed1 = (email) => allowedSample.map(e => e.trim().toLowerCase()).includes((email || '').trim().toLowerCase());
      assert(isAllowed1('user2@example.com') === true, 'Allowlist: Case-insensitive & trimmed match');
      assert(isAllowed1('USER2@EXAMPLE.COM ') === true, 'Allowlist: Uppercase & trailing whitespace match');
      assert(isAllowed1('unauthorized@example.com') === false, 'Allowlist: Non-allowlisted user denied');

      // Test 9. Single-Flight Promise Coalescing
      let executionCount = 0;
      let singleFlightPending = null;
      async function mockSingleFlightAuth() {
        if (singleFlightPending) return singleFlightPending;
        singleFlightPending = (async () => {
          executionCount++;
          await new Promise(r => setTimeout(r, 50));
          return 'mock_token_123';
        })();
        try {
          return await singleFlightPending;
        } finally {
          singleFlightPending = null;
        }
      }

      const [res1, res2, res3] = await Promise.all([
        mockSingleFlightAuth(),
        mockSingleFlightAuth(),
        mockSingleFlightAuth()
      ]);
      assert(res1 === 'mock_token_123' && res2 === 'mock_token_123' && res3 === 'mock_token_123', 'Single-Flight: Parallel callers receive same result');
      assert(executionCount === 1, 'Single-Flight: Only ONE authorization execution occurs for concurrent requests');

      // Test 10. Non-Interactive Restoration Method Check
      assert(typeof sheetsService.restoreSession === 'function', 'Auth: restoreSession helper method is defined on SheetsService');
      
      let capturedPrompt = null;
      const mockService = new SheetsService();
      mockService.tokenClient = {
        requestAccessToken: (opts) => { capturedPrompt = opts.prompt; }
      };
      mockService.ensureAuthorized('');
      assert(capturedPrompt === '', 'Auth: Automatic restoration uses prompt: "" (non-interactive, no forced consent)');

      // Test 11. Zero Persistence of OAuth Tokens Verification
      assert(localStorage.getItem('accessToken') === null && localStorage.getItem('token') === null, 'Security: OAuth access tokens are NEVER stored in localStorage');
      assert(sessionStorage.getItem('accessToken') === null && sessionStorage.getItem('token') === null, 'Security: OAuth access tokens are NEVER stored in sessionStorage');

      // Summary
      if (failed === 0) {
        summaryContainer.className = 'p-4 rounded-lg font-bold text-sm bg-emerald-950 text-emerald-300 border border-emerald-800';
        summaryContainer.textContent = `ALL ${passed} VERIFICATION & E2E TESTS PASSED SUCCESSFULLY!`;
      } else {
        summaryContainer.className = 'p-4 rounded-lg font-bold text-sm bg-rose-950 text-rose-300 border border-rose-800';
        summaryContainer.textContent = `${failed} OF ${passed + failed} TESTS FAILED.`;
      }
    })();
  </script>
</body>
</html>
