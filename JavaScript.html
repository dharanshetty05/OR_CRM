<script>
  (function () {
    var elements = {
      badge: document.getElementById('status-badge'),
      retryButton: document.getElementById('retry-health-check'),
      loading: document.getElementById('loading-state'),
      error: document.getElementById('error-state'),
      details: document.getElementById('health-details'),
      app: document.getElementById('health-app'),
      version: document.getElementById('health-version'),
      success: document.getElementById('health-success'),
      timestamp: document.getElementById('health-timestamp')
    };

    function setStatus(state) {
      elements.loading.classList.toggle('is-hidden', state !== 'loading');
      elements.error.classList.toggle('is-hidden', state !== 'error');
      elements.details.classList.toggle('is-hidden', state !== 'success');

      elements.badge.classList.toggle('is-success', state === 'success');
      elements.badge.classList.toggle('is-error', state === 'error');
      elements.badge.textContent = state === 'success'
        ? 'Connected'
        : state === 'error'
          ? 'Error'
          : 'Checking';
    }

    function callServer(functionName, args) {
      args = args || [];
      setStatus('loading');

      return new Promise(function (resolve, reject) {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error('Apps Script client bridge is unavailable.'));
          return;
        }

        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (error) {
            reject(error || new Error('The server call failed.'));
          });

        runner[functionName].apply(runner, args);
      });
    }

    function renderHealth(response) {
      if (!response || response.success !== true) {
        throw new Error('Health check returned an unsuccessful response.');
      }

      elements.app.textContent = response.app || '-';
      elements.version.textContent = response.version || '-';
      elements.success.textContent = String(response.success);
      elements.timestamp.textContent = response.timestamp || '-';
      setStatus('success');
    }

    function renderError(error) {
      console.error('Health check failed:', error);
      setStatus('error');
    }

    function loadHealth() {
      callServer('getAppHealth')
        .then(renderHealth)
        .catch(renderError);
    }

    elements.retryButton.addEventListener('click', loadHealth);
    document.addEventListener('DOMContentLoaded', loadHealth);
  }());
</script>
