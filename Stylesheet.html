<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --sidebar: #162033;
    --sidebar-muted: #aab5c6;
    --text: #1f2937;
    --muted: #667085;
    --border: #d8dee9;
    --accent: #2563eb;
    --accent-soft: #e8f0ff;
    --danger: #b42318;
    --danger-soft: #fff1f0;
    --success: #067647;
    --success-soft: #ecfdf3;
    --shadow: 0 16px 45px rgba(31, 41, 55, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.5;
  }

  button {
    font: inherit;
  }

  .app-shell {
    display: grid;
    min-height: 100vh;
    grid-template-columns: 260px minmax(0, 1fr);
  }

  .sidebar {
    background: var(--sidebar);
    color: #ffffff;
    padding: 24px 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 6px 28px;
  }

  .brand-mark {
    display: grid;
    width: 40px;
    height: 40px;
    place-items: center;
    border-radius: 8px;
    background: #ffffff;
    color: var(--sidebar);
    font-weight: 700;
  }

  .brand-name,
  .brand-subtitle {
    margin: 0;
  }

  .brand-name {
    font-weight: 700;
  }

  .brand-subtitle {
    color: var(--sidebar-muted);
    font-size: 13px;
  }

  .nav-list {
    display: grid;
    gap: 6px;
  }

  .nav-item {
    width: 100%;
    min-height: 42px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--sidebar-muted);
    cursor: pointer;
    padding: 10px 12px;
    text-align: left;
  }

  .nav-item:hover,
  .nav-item:focus-visible,
  .nav-item.is-active {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    outline: none;
  }

  .main-content {
    padding: 40px;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
  }

  .eyebrow {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
  }

  h1,
  h2 {
    margin: 0;
    line-height: 1.2;
  }

  h1 {
    font-size: 32px;
  }

  h2 {
    font-size: 18px;
  }

  .secondary-button {
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    padding: 8px 14px;
  }

  .secondary-button:hover,
  .secondary-button:focus-visible {
    border-color: var(--accent);
    outline: none;
  }

  .status-section {
    max-width: 760px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .status-badge {
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
  }

  .status-badge.is-success {
    background: var(--success-soft);
    color: var(--success);
  }

  .status-badge.is-error {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .loading-state,
  .error-state {
    border-radius: 8px;
    padding: 14px 16px;
  }

  .loading-state {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .error-state {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .health-details {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 0;
  }

  .health-details div {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }

  dt {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  dd {
    margin: 0;
    overflow-wrap: anywhere;
  }

  .is-hidden {
    display: none;
  }

  @media (max-width: 760px) {
    .app-shell {
      grid-template-columns: 1fr;
    }

    .sidebar {
      padding: 18px;
    }

    .nav-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .main-content {
      padding: 24px 18px;
    }

    .page-header {
      display: grid;
    }

    .health-details {
      grid-template-columns: 1fr;
    }
  }
</style>
